name: CultureSync CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./culturesync-backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './culturesync-backend/package-lock.json'
      - name: Install Dependencies
        run: npm ci
      - name: Run Exhaustive Tests & Coverage
        run: npm run test:coverage
        env:
          JWT_SECRET: ci_test_secret

  android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run 150+ Logic Permutation Tests
        run: ./gradlew testDebugUnitTest --continue
